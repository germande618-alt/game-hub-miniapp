<style>

#board {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 200px;
}

.card {
  position: absolute;
  width: 60px;
  transition: all 0.3s ease;
}

#player {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    height: 220px;
    width: 100%;
}

#player .card {
    position: absolute;
    width: 110px;
    height: 160px;
    transition: 0.25s;
    transform-origin: bottom center;
}

.card img {
    width: 100%;
    height: 100%;
}

#board {
    position: relative;
    flex: 1;
}

#deck {
    position: absolute;
    width: 80px;
    height: 120px;
    background: #444;
    border-radius: 8px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

#trump {
    position: absolute;
    width: 80px;
    height: 120px;
    left: calc(50% + 20px);
    top: calc(50% + 20px);
    transform: rotate(90deg);
}

#trump img {
    width: 100%;
    height: 100%;
}

.fly {
    position: fixed;
    z-index: 9999;

    width: 80px;
    height: 120px;

    background: white;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    transition: all 0.4s ease;
}

.board-card {
    width: 50px;
    height: 70px;
    background: white;
    border-radius: 8px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin: 5px;
}

.card:active {
    transform: translateY(-40px) scale(1.15);
    z-index: 999;
}

#player {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    height: 220px;
    width: 100%;
}

#player .card {
    position: absolute;
    width: 110px;
    height: 160px;
    transition: 0.25s;
    transform-origin: bottom center;
}

.card {
    position: absolute;
    bottom: -10px;

    width: 80px;
    height: 120px;

    background: white;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    font-weight: bold;

    transition: 0.25s;
}

/* эффект наведения */
.card:active {
    transform: translateY(-30px) scale(1.1);
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}

button:hover{
transform: scale(1.03);
}

button{
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:active{
transform: scale(0.95);
box-shadow: 0 0 0 rgba(0,0,0,0);
}

#table {
    position: fixed;

    right: 0;
    bottom: 0;

    flex-direction: column;

}

#board {

    align-items: center;
}

#player {

    justify-content: center;

    margin-bottom: 20px;
}

.card {
    width: 60px;
    height: 90px;
    background: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    transition: 0.2s;
}

.card:active {
    transform: translateY(-20px);
}

.fadeIn{
animation: fadeIn 0.4s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform: translateY(10px);
}

to{
opacity:1;
transform: translateY(0);
}
}

height:100vh;

.circlePlayer{

function showLanguageSelect(){

document.getElementById("app").innerHTML=`

<h2>${translations.en.choose}</h2>

<button onclick="setLang('ru')">Русский</button>
<button onclick="setLang('en')">English</button>

<button onclick="setLang('fr')">Français</button>

`

}

function setLang(l){

lang=l
localStorage.setItem("lang",l)
loadMain()

}

function loadMain(){

const t = translations[lang]

document.getElementById("app").innerHTML = `
<div class="fadeIn">
</div>
<h1>${t.title}</h1>

<button onclick="openCouple()">❤️ ${t.couple}</button>

<button onclick="openParty()">🎉 ${t.party}</button>

<button onclick="openOnline()">🌐 ${t.online}</button>

<br><br>

<button onclick="changeLanguage()">⚙ ${t.settings}</button>

`

}

function changeLanguage(){

}
